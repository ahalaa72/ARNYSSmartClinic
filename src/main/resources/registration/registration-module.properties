# ============================================================================
# Patient Self-Registration Module Configuration
# Version: 1.0.0
#
# This file contains all configurable settings for the Patient Self-Registration
# module. Copy this file to your application's config directory and customize
# as needed for each clinic installation.
#
# Note: Database configuration (registration_module_config table) takes
# precedence over these file-based settings when available.
# ============================================================================

# ============================================================================
# MODULE SETTINGS
# ============================================================================

# Enable/disable the entire registration module
# Set to false to completely disable the feature
registration.module.enabled=true

# Module version for compatibility checking
registration.module.version=1.0.0

# ============================================================================
# TOKEN CONFIGURATION
# ============================================================================

# How long a registration session token is valid (in minutes)
# Patient must complete registration within this time after scanning QR
registration.token.expiry.minutes=30

# Length of generated token (characters)
registration.token.length=64

# Token generation algorithm (SECURE_RANDOM recommended)
registration.token.algorithm=SECURE_RANDOM

# ============================================================================
# RATE LIMITING
# ============================================================================

# Maximum QR scans (new sessions) per IP address per hour
registration.ratelimit.sessions.per.ip.per.hour=5

# Maximum form submissions per IP address per hour
registration.ratelimit.submissions.per.ip.per.hour=5

# Maximum config endpoint calls per IP per hour
registration.ratelimit.config.per.ip.per.hour=100

# Enable/disable rate limiting (disable for testing only)
registration.ratelimit.enabled=true

# ============================================================================
# QR CODE SETTINGS
# ============================================================================

# Base URL for the registration form (auto-detected if not set)
# Example: https://clinic.example.com/oscar
registration.qrcode.base.url=

# QR code image dimensions (pixels)
registration.qrcode.width=300
registration.qrcode.height=300

# QR code error correction level (L, M, Q, H)
# H = highest error correction, larger QR code
registration.qrcode.error.correction=M

# ============================================================================
# DEFAULT VALUES (Pre-populated in form)
# ============================================================================

# Default province/territory for address
registration.default.province=ON

# Default country
registration.default.country=Canada

# Default form language
registration.default.language=en

# ============================================================================
# MANDATORY FIELDS
# Comma-separated list of fields that must be filled by patient
# ============================================================================

registration.mandatory.fields=first_name,last_name,year_of_birth,month_of_birth,date_of_birth,sex,address,city,province,postal,cell_phone,email

# ============================================================================
# VALIDATION SETTINGS
# ============================================================================

# Enable HIN (Health Insurance Number) validation
registration.validation.hin.enabled=true

# Enable duplicate patient detection
registration.validation.duplicate.enabled=true

# Duplicate detection strictness (STRICT, MODERATE, RELAXED)
# STRICT: Exact match on HIN or (name + DOB)
# MODERATE: Fuzzy match on name + DOB
# RELAXED: Only HIN match
registration.validation.duplicate.strictness=MODERATE

# Enable postal code format validation
registration.validation.postal.enabled=true

# Enable phone number format validation
registration.validation.phone.enabled=true

# ============================================================================
# EMAIL NOTIFICATIONS
# ============================================================================

# Enable email notifications
registration.email.enabled=true

# Staff notification - send email when new registration submitted
registration.email.staff.notification.enabled=true

# Staff email addresses (comma-separated for multiple)
registration.email.staff.addresses=

# Patient notification - send email on approval/rejection
registration.email.patient.notification.enabled=true

# Email sender address
registration.email.from.address=noreply@clinic.example.com

# Email sender name
registration.email.from.name=Patient Registration

# Supported languages for patient emails (comma-separated)
# en=English, fr=French, ar=Arabic, hi=Hindi, zh=Mandarin
registration.email.supported.languages=en,fr,ar,hi,zh

# ============================================================================
# CLINIC BRANDING
# ============================================================================

# Clinic name (displayed on form and emails)
registration.clinic.name=Medical Clinic

# Clinic phone number
registration.clinic.phone=

# Clinic address
registration.clinic.address=

# Clinic logo URL (optional, for emails and print materials)
registration.clinic.logo.url=

# Primary brand color (hex code)
registration.clinic.primary.color=#007bff

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

# Enable CAPTCHA on form submission
registration.security.captcha.enabled=true

# CAPTCHA provider (RECAPTCHA_V2, RECAPTCHA_V3, HCAPTCHA)
registration.security.captcha.provider=RECAPTCHA_V2

# reCAPTCHA site key (get from Google reCAPTCHA console)
registration.security.captcha.site.key=

# reCAPTCHA secret key
registration.security.captcha.secret.key=

# Allowed origins for CORS (comma-separated, empty = same origin only)
registration.security.cors.allowed.origins=

# ============================================================================
# DATA RETENTION
# ============================================================================

# Days to keep expired/rejected registrations before purging
registration.data.retention.days=30

# Cleanup job schedule (cron expression)
# Default: Daily at 2 AM
registration.cleanup.schedule=0 0 2 * * ?

# Token cleanup schedule (cron expression)
# Default: Every 15 minutes
registration.token.cleanup.schedule=0 */15 * * * ?

# ============================================================================
# LOGGING
# ============================================================================

# Enable detailed audit logging
registration.logging.audit.enabled=true

# Log level for registration module (DEBUG, INFO, WARN, ERROR)
registration.logging.level=INFO

# ============================================================================
# INTEGRATION SETTINGS
# ============================================================================

# Auto-assign provider on approval (provider_no)
# Leave empty to require manual selection
registration.integration.default.provider=

# Auto-assign to waiting list on approval (waiting_list_id)
registration.integration.waiting.list.id=

# Create tickler on new registration for staff review
registration.integration.create.tickler=true

# Tickler assignment (provider_no, leave empty for all providers)
registration.integration.tickler.assign.to=
